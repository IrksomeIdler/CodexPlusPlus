[package]
name = "codex-plus-manager"
default-run = "codex-plus-plus"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "codex_plus_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "codex-plus-plus"
path = "src/main.rs"

[[bin]]
name = "codex-plus-legacy-shim"
path = "src/legacy_shim.rs"
required-features = ["legacy-shim"]

[dependencies]
anyhow.workspace = true
async-trait = "0.1"
codex-plus-core = { path = "../../../crates/codex-plus-core" }
codex-plus-data = { path = "../../../crates/codex-plus-data" }
codex-plus-launcher = { path = "../../codex-plus-launcher" }
directories.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["protocol-asset", "custom-protocol", "tray-icon"] }
tauri-plugin-dialog = "2"
toml_edit.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# 构建期禁用社区/推广内容（广告推荐、Telegram/Discord 社区链接）。
disable-community = ["codex-plus-core/disable-community"]
# macOS 旧更新器的兼容壳，默认不构建（见 legacy-shim 的 required-features）。
legacy-shim = ["codex-plus-core/legacy-shim"]

[dev-dependencies]
tempfile.workspace = true
